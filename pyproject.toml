[project]
name = "tastydesk"
version = "0.1.0"
description = "Strategy-aware options journal and risk dashboard for tastytrade"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.2.0",
    "pydantic-settings>=2.15.0",
    "tastytrade>=13.2.3",
    "uvicorn[standard]>=0.52.4",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tastydesk"]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:tastydesk.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
