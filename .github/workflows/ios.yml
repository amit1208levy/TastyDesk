# The iPhone app.
#
# "engine" runs on every pull request that touches the code the phone runs:
# the Mac's test suite, the phone engine's start-up check, the parity check
# (the Mac's Python and the phone engine must give identical numbers), and the
# layout check (every tab fits an iPhone's screen).
#
# "testflight" builds the app and uploads it to TestFlight. It runs only when
# started by hand (Actions -> iPhone app -> Run workflow), and only after
# "engine" has passed on the same commit.
name: iPhone app

on:
  pull_request:
    paths:
      - "src/**"
      - "ios/**"
      - "web/**"
      - "uv.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Build and upload to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Mac test suite
        run: uv run pytest -q -m "not slow"
      - name: Bundle the phone engine
        working-directory: ios
        run: npm ci --no-audit --no-fund && npm run bundle
      - name: Engine starts and answers
        working-directory: ios
        run: npm run check
      - name: Parity (Mac vs phone, every value)
        working-directory: ios
        run: npm run parity
      - name: Mac and phone share what is set by hand
        working-directory: ios
        run: npm run devices
      - name: Pages build
        working-directory: web
        run: npm ci --no-audit --no-fund && npx tsc -b && npm run build
      - name: Every tab fits an iPhone
        working-directory: ios
        run: npx playwright install --with-deps chromium && npm run layout
      - name: Screenshots of the tabs that did not fit
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-layout
          path: ios/layout/shots/
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    needs: engine
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build and upload
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # Name what is missing or malformed (never the values themselves).
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is empty or not set"; missing=1; fi
          done
          if [ -n "$APPLE_TEAM_ID" ] && ! [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID should be 10 letters and digits"; missing=1
          fi
          if [ -n "$ASC_KEY_ID" ] && ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::ASC_KEY_ID should be 10 letters and digits"; missing=1
          fi
          if [ -n "$ASC_KEY_P8" ] && [[ "$ASC_KEY_P8" != *"BEGIN PRIVATE KEY"* ]]; then
            echo "::error::ASC_KEY_P8 should be the whole .p8 file, BEGIN and END lines included"; missing=1
          fi
          [ "$missing" = 0 ] || exit 1
          # The key exists only for this run, readable only by this user.
          umask 077
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          ./scripts/testflight.sh
